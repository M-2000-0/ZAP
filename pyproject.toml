[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zpx-lang"
version = "0.2.0"
description = "Zpx — AI-native, full-stack, token-efficient programming language. Self-hosting, zero-boilerplate, 248+ builtins, no imports, no build step."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "M-2000-0"},
]
requires-python = ">=3.10"
keywords = [
    "programming-language",
    "ai-native",
    "fullstack",
    "token-efficient",
    "self-hosting",
    "zero-boilerplate",
    "python-alternative",
    "llm-optimized",
    "no-build-step",
    "pattern-matching",
    "design-by-contract",
    "interpreted-language",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/M-2000-0/ZPX"
Repository = "https://github.com/M-2000-0/ZPX"

[project.scripts]
zpx = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package_data]
src = ["*.ico"]
