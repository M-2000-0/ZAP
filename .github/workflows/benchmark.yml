name: LLM Benchmark

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Mondays
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to test (comma-separated)'
        required: false
        default: 'gpt-4o-mini,claude-3-haiku'
      tasks:
        description: 'Task IDs to run (comma-separated, empty for all)'
        required: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install ZPX
        run: |
          pip install -e .
          
      - name: Install benchmark dependencies
        run: |
          pip install openai anthropic google-generativeai pytest pytest-asyncio
          
      - name: Run benchmarks
        run: |
          python benchmarks/run_benchmarks.py \
            --models ${{ github.event.inputs.models || 'gpt-4o-mini' }} \
            --tasks ${{ github.event.inputs.tasks || '' }} \
            --output benchmarks/results_${{ github.run_id }}.json
            
      - name: Generate report
        run: |
          python benchmarks/generate_report.py \
            benchmarks/results_${{ github.run_id }}.json \
            benchmarks/report_${{ github.run_id }}.md
            
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmarks/results_${{ github.run_id }}.json
            benchmarks/report_${{ github.run_id }}.md
            
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`benchmarks/report_${{ github.run_id }}.md`, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 LLM Benchmark Results\n\n${report}`
            })